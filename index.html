<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FaAroon</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0EA5E9" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FaAroon" />

<link rel="stylesheet" href="style.css?v=202609011813" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
<div id="root">
  <div class="shop-root" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;min-height:100vh;min-height:100dvh;">
    <img src="./icon-192.png" alt="" class="splash-logo-pulse" style="width:80px;height:80px;border-radius:1rem;box-shadow:0 10px 25px rgba(0,0,0,.35);" />
    <h1 class="splash-fade-in" style="font-size:1.5rem;font-weight:800;letter-spacing:0.02em;margin:0;">FaAroon</h1>
    <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    <p class="splash-fade-in" style="font-size:0.75rem;color:#64748B;margin:0;">...جارٍ التحميل</p>
  </div>
</div>
<script src="app.js?v=202609142259"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      const registration = await navigator.serviceWorker.register("sw.js").catch(() => null);
      if (registration && "periodicSync" in registration) {
        try {
          const status = await navigator.permissions.query({ name: "periodic-background-sync" });
          if (status.state === "granted") {
            await registration.periodicSync.register("check-alawadly-alerts", {
              minInterval: 60 * 60 * 1000,
            });
          }
        } catch (e) {
          // Not supported on this browser/device — silently skip.
        }
      }
    });
  }
</script>
</body>
</html>

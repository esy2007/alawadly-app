<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FaAroon</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0EA5E9" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FaAroon" />

<link rel="stylesheet" href="style.css?v=21" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app.js?v=21"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      const registration = await navigator.serviceWorker.register("sw.js").catch(() => null);
      if (registration && "periodicSync" in registration) {
        try {
          const status = await navigator.permissions.query({ name: "periodic-background-sync" });
          if (status.state === "granted") {
            await registration.periodicSync.register("check-alawadly-alerts", {
              minInterval: 60 * 60 * 1000,
            });
          }
        } catch (e) {
          // Not supported on this browser/device — silently skip.
        }
      }
    });
  }
</script>
</body>
</html>
